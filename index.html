<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#334c3d"><title>桌游工坊 Tablecraft</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23334c3d'/%3E%3Cpath d='M16 24 32 15 48 24v20l-16 9-16-9Z' fill='none' stroke='%23e7c489' stroke-width='4'/%3E%3Cpath d='m16 24 16 9 16-9M32 33v20' fill='none' stroke='%23e7c489' stroke-width='4'/%3E%3C/svg%3E"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/shell.css"><link rel="stylesheet" href="/src/plaza.css"><link rel="stylesheet" href="/src/hand.css"></head>
<body>
<section id="plaza" aria-label="作品广场与本地草稿">
  <header class="plaza-header"><a class="plaza-brand" href="/" aria-label="桌游工坊作品广场"><span>⬡</span><strong>桌游工坊</strong></a><nav aria-label="作品广场导航"><button data-plaza-filter="all" class="active">作品广场</button><button data-plaza-filter="mine">本地草稿 <b id="plaza-project-count">0</b></button></nav><div class="plaza-actions"><button data-action="import-session" class="quiet">导入文件</button><button class="plaza-new" data-action="new-project">＋ 新建游戏</button></div></header>
  <main class="plaza-main"><div class="plaza-library-heading"><div><h1 id="plaza-section-title">作品广场</h1><p id="plaza-section-note">选择一个游戏，开始游玩或编辑。</p></div><label class="plaza-search">⌕ <input id="plaza-search" type="search" placeholder="搜索游戏" aria-label="搜索游戏"></label></div><p id="plaza-loading" role="status">正在读取…</p><div id="plaza-grid" class="plaza-grid"></div><p class="plaza-local-note">保存在当前浏览器 · 作品广场与本地草稿独立保存</p></main>
</section>
<div id="app" data-mode="play" hidden>
  <header class="topbar">
    <button class="brand" data-action="plaza" aria-label="返回作品广场"><span class="brand-mark">⬡</span><strong>桌游工坊<span>TABLECRAFT</span></strong></button>
    <div class="project-name"><span class="status-dot"></span><span>我的游戏</span><span class="local-badge">本地</span><span id="active-profile-name" class="local-badge"></span></div>
    <div class="header-actions"><span id="save-status">已自动保存</span><button data-action="undo" class="icon-button" title="撤销 Ctrl+Z" aria-label="撤销">↶</button><button data-action="redo" class="icon-button" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button><button data-action="save-draft" class="quiet">保存草稿</button><button data-action="publish" class="quiet">导出到作品广场 ↗</button><button data-mode="play" class="play-button" title="进入游玩模式 Ctrl+E">▷ 开始游玩</button></div>
  </header>
  <div class="workspace">
    <aside class="library drawer" id="assets-drawer" aria-label="资产抽屉" aria-hidden="true" inert>
      <div class="drawer-heading"><div><span class="section-eyebrow">BUILD YOUR TABLE</span><h2>资产库</h2></div><button data-action="close-drawer" class="drawer-close" aria-label="关闭资产抽屉">×</button></div>
      <div class="library-heading"><h2>资产库</h2><span id="asset-total">18 张卡牌</span></div>
      <div class="library-sources" role="tablist" aria-label="素材来源"><button data-library="game" class="active" role="tab" aria-selected="true">游戏素材</button><button data-tab="public" role="tab" aria-selected="false">公共素材</button></div>
      <div class="asset-tabs" role="tablist" aria-label="游戏素材分类"><button data-tab="cards" class="active" role="tab">卡牌</button><button data-tab="dice" role="tab">骰子</button><button data-tab="tokens" role="tab">标记</button><button data-tab="boards" role="tab">版图</button></div>
      <div id="asset-library" class="asset-library"></div>
      <div class="library-bottom"><button class="text-button hidden" data-action="blank-table">清空桌面摆放 <span>↺</span></button><button class="import-button" data-action="import-assets"><span>＋</span> 导入游戏素材</button><button class="text-button" data-action="import-session">打开桌面存档 <span>↗</span></button><p>灵感落在桌上，游戏由你定义。</p></div>
    </aside>
    <main class="main-area">
      <div id="game-controls" aria-label="游戏专用操作" hidden></div>
      <div class="table-viewport" id="viewport" tabindex="0" aria-label="桌游桌面，空白处左键拖动框选，空格加拖动或中键拖动移动视角，鼠标悬停物件加滚轮旋转，骰子和数值标记加滚轮增减值，Ctrl 加滚轮缩放，数值标记上滚轮调整数值">
        <div id="selection-marquee" hidden aria-hidden="true"></div>
        <div class="table-atmosphere"></div>
        <div class="scene" id="scene"><div class="surface"></div><div class="grid-overlay" id="grid"></div><div id="game-zones"></div><div id="objects"></div><div id="draw-target" hidden tabindex="0" role="button" aria-label="拖动调整点击发牌位置"><span>点击发牌位置</span></div><div id="card-snap-preview" hidden aria-hidden="true"><span></span></div></div>
        <div id="deck-draw-tools" role="group" aria-label="顶牌操作" hidden></div>
        <div class="table-bottom"><div class="gesture-hint"><kbd>拖动</kbd> 移动物件 <span>·</span> <kbd>F</kbd> 翻面 <span>·</span> <kbd>空格＋拖动</kbd> 移动画布</div><div class="view-tools"><button data-action="sound" title="切换音效" id="sound-button">♪</button><button data-action="grid" title="切换网格" id="grid-button">▦</button><i></i><button data-action="zoom-out" title="缩小">−</button><span id="zoom-label">100%</span><button data-action="zoom-in" title="放大">＋</button><button data-action="fit" title="适应桌面">⌗</button></div></div>
      </div>
    </main>
    <aside class="settings-drawer drawer" id="settings-drawer" aria-label="桌面设置抽屉" aria-hidden="true" inert>
      <div class="drawer-heading"><div><span class="section-eyebrow">MAKE ROOM FOR PLAY</span><h2>桌面设置</h2></div><button data-action="close-drawer" class="drawer-close" aria-label="关闭桌面设置抽屉">×</button></div>
      <div class="drawer-scroll"><div class="table-toolbar"><div><span class="tiny-label">正在编辑</span><h2>我的游戏</h2></div></div><div class="table-status"><span id="table-mode-label">编辑桌面</span><span id="table-item-count"></span></div><div id="table-settings-content"></div><div class="drawer-command-list"><button data-action="fit">⌗ <span>适应桌面</span><kbd>0</kbd></button><button data-action="rules">▤ <span>游戏规则</span><span>↗</span></button><button data-action="help">? <span>操作与快捷键</span><span>↗</span></button><button data-action="download-session">下载备份文件 ↗</button></div></div>
    </aside>
    <aside class="object-drawer drawer" id="object-drawer" aria-label="物件属性" aria-hidden="true" inert><div class="drawer-heading"><h2>物件属性</h2><button data-action="close-object" class="drawer-close" aria-label="关闭物件属性">×</button></div><div id="inspector-content" class="drawer-scroll"></div></aside>  </div>
  <nav class="editor-dock" aria-label="编辑工具"><button data-action="manage-profiles" title="角色开局方案"><span>♧</span><small>开局方案</small></button><button data-drawer="assets" aria-controls="assets-drawer" aria-expanded="false" title="资产库"><span>▦</span><small>资产</small></button><button data-drawer="settings" aria-controls="settings-drawer" aria-expanded="false" title="桌面设置"><span>☷</span><small>桌面</small></button></nav>
  <div class="play-actions" role="group" aria-label="游玩操作">
  <button id="play-help" data-action="help" title="操作与快捷键" aria-label="查看和设置快捷键"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-1.2.7-1.8 1.2-1.8 2.8M12 17h.01"/></svg></button>
  <button id="mode-toggle" data-mode="edit" title="编辑桌面 · Ctrl+E" aria-label="进入编辑模式 Ctrl+E"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg></button>
  <button id="play-new-game" data-action="new-game" title="开始新一局" aria-label="开始新一局"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5M4.5 10a8 8 0 1 1 .5 6"/></svg></button>
  </div>
  <button id="play-plaza" data-action="plaza" title="返回作品广场" aria-label="返回作品广场"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg></button>
  <button id="play-reset-view" data-action="reset-view" title="恢复开局时的缩放与位置" aria-label="回到初始视野"><svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><button class="modal-close icon-button" data-action="close-modal" aria-label="关闭">×</button><div id="modal-content"></div></dialog>
<input type="file" id="asset-input" accept="image/png,image/jpeg,image/webp" multiple hidden><input type="file" id="session-input" accept="application/json,.json" hidden>
<script type="module" src="/src/app.js"></script>
</body></html>
